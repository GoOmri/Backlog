name: Probe Worker
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W=https://backlog-api.goomric.workers.dev; O="Origin: https://goomri.github.io"
          echo "== search"; curl -s -H "$O" "$W/search?q=In%20Between" | head -c 300; echo
          echo "== match"; curl -s -X POST -H "$O" -H "Content-Type: application/json" -d '{"titles":["In Between","We Were Here","Hollow Knight"]}' "$W/match" | head -c 900; echo
